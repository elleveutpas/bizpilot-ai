<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Créer votre assistant - BizPilot AI</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f6fa;
      color: #111827;
    }

    header {
      height: 70px;
      background: white;
      border-bottom: 1px solid #e5e7eb;
      display: flex;
      align-items: center;
      padding: 0 7%;
    }

    .logo {
      font-size: 24px;
      font-weight: bold;
    }

    .logo span {
      font-weight: normal;
    }

    .container {
      max-width: 600px;
      margin: 60px auto;
      padding: 0 20px;
    }

    .card {
      background: white;
      padding: 35px;
      border-radius: 18px;
      border: 1px solid #e5e7eb;
      box-shadow: 0 20px 50px rgba(0,0,0,0.08);
    }

    h1 {
      margin-top: 0;
      font-size: 32px;
    }

    p {
      color: #6b7280;
      line-height: 1.6;
    }

    label {
      display: block;
      margin-top: 20px;
      font-weight: bold;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 13px;
      margin-top: 8px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 15px;
    }

    button {
      width: 100%;
      margin-top: 25px;
      padding: 15px;
      border: none;
      border-radius: 9px;
      background: #111827;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #000;
    }
  </style>
</head>

<body>

<header>
  <div class="logo">
    BizPilot <span>AI</span>
  </div>
</header>

<div class="container">

  <div class="card">

    <h1>Créons votre assistant 🤖</h1>

    <p>
      Renseignez quelques informations sur votre entreprise
      pour commencer.
    </p>

    <form onsubmit="goToDashboard(event)">

      <label>
        Nom de l'entreprise
        <input
          id="company"
          type="text"
          placeholder="Ex. Pacific Services"
          required
        >
      </label>

      <label>
        Secteur d'activité
        <input
          id="sector"
          type="text"
          placeholder="Ex. Restaurant, garage..."
          required
        >
      </label>

      <label>
        Ville / pays
        <input
          id="location"
          type="text"
          placeholder="Ex. Nouméa, Nouvelle-Calédonie"
          required
        >
      </label>

      <label>
        Horaires
        <input
          id="hours"
          type="text"
          placeholder="Ex. Lundi-Samedi, 8h-17h"
          required
        >
      </label>

      <label>
        Services proposés
        <input
          id="services"
          type="text"
          placeholder="Ex. Réparation, vente, conseil..."
          required
        >
      </label>

      <button type="submit">
        Créer mon assistant IA →
      </button>

    </form>

  </div>

</div>

<script>

function goToDashboard(event) {

  event.preventDefault();

  const company = document.getElementById("company").value;

  localStorage.setItem("company", company);

  window.location.href = "dashboard.html";
}

</script>

</body>
</html>
