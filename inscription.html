<!DOCTYPE html>

<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Créer votre espace - BizPilot AI</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f6fa;
      color: #111827;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 30px;
    }

    .box {
      background: white;
      width: 100%;
      max-width: 500px;
      padding: 40px;
      border-radius: 18px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.08);
    }

    h1 {
      margin-bottom: 10px;
    }

    p {
      color: #6b7280;
      margin-bottom: 25px;
      line-height: 1.5;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 13px;
      margin-bottom: 18px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 15px;
    }

    button {
      width: 100%;
      padding: 14px;
      background: #111827;
      color: white;
      border: none;
      border-radius: 9px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #000;
    }
  </style>

</head>

<body>

  <div class="box">

```
<h1>Créer votre espace</h1>

<p>
  Configurez votre entreprise pour commencer à utiliser BizPilot AI.
</p>

<label>Nom de votre entreprise</label>
<input type="text" placeholder="Ex : Mon entreprise">

<label>Votre adresse e-mail</label>
<input type="email" placeholder="exemple@email.com">

<label>Votre activité</label>
<input type="text" placeholder="Ex : restaurant, garage, commerce...">

<button onclick="window.location.href='dashboard.html'">
  Créer mon espace →
</button>
```

  </div>

</body>
</html>
