<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Assistant IA - BizPilot AI</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #111827;
    }

    header {
      background: white;
      padding: 20px;
      border-bottom: 1px solid #ddd;
    }

    header h1 {
      margin: 0;
    }

    main {
      max-width: 800px;
      margin: 40px auto;
      padding: 20px;
    }

    .chat {
      background: white;
      border-radius: 15px;
      padding: 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    #messages {
      height: 400px;
      overflow-y: auto;
      border: 1px solid #ddd;
      border-radius: 10px;
      padding: 15px;
      margin-bottom: 15px;
    }

    .message {
      padding: 10px 14px;
      margin: 8px 0;
      border-radius: 10px;
      max-width: 80%;
    }

    .user {
      background: #e5e7eb;
      margin-left: auto;
      text-align: right;
    }

    .ai {
      background: #f0f4ff;
      margin-right: auto;
    }

    .input-area {
      display: flex;
      gap: 10px;
    }

    #userInput {
      flex: 1;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      padding: 12px 20px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      background: #111827;
      color: white;
      font-size: 16px;
    }
  </style>
</head>

<body>

<header>
  <h1>🤖 BizPilot AI</h1>
</header>

<main>

  <div class="chat">

    <h2>Assistant IA</h2>

    <div id="messages">
      <div class="message ai">
        Bonjour ! Comment puis-je vous aider ?
      </div>
    </div>

    <div class="input-area">

      <input
        id="userInput"
        type="text"
        placeholder="Écrivez votre message..."
      >

      <button onclick="sendMessage()">
        Envoyer
      </button>

    </div>

  </div>

</main>

<script>
async function sendMessage() {

  const input = document.getElementById("userInput");
  const messages = document.getElementById("messages");

  const message = input.value.trim();

  if (!message) {
    return;
  }

  const userMessage = document.createElement("div");
  userMessage.className = "message user";
  userMessage.textContent = message;

  messages.appendChild(userMessage);

  input.value = "";

  messages.scrollTop = messages.scrollHeight;

  try {

    const response = await fetch(
      "https://bizpilot-ai-amber.vercel.app/api/chat",
      {
        method: "POST",

        headers: {
          "Content-Type": "application/json"
        },

        body: JSON.stringify({
          message: message
        })
      }
    );

    const data = await response.json();

    const aiMessage = document.createElement("div");
    aiMessage.className = "message ai";

    if (data.reply) {
      aiMessage.textContent = data.reply;
    } else {
      aiMessage.textContent = "Une erreur est survenue.";
    }

    messages.appendChild(aiMessage);

    messages.scrollTop = messages.scrollHeight;

  } catch (error) {

    console.error(error);

    const aiMessage = document.createElement("div");
    aiMessage.className = "message ai";

    aiMessage.textContent =
      "Impossible de contacter le serveur.";

    messages.appendChild(aiMessage);

    messages.scrollTop = messages.scrollHeight;
  }
}
</script>

</body>
</html>
